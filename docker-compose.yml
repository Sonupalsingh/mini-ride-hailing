# Mini Uber/Ola — ride-hailing demo on Kafka + Zookeeper.
#
# Zookeeper: coordinates the Kafka cluster (broker registry, leader
#            election, metadata). Kafka can't start without it.
# Kafka:     the event bus. Every ride-related happening (requested,
#            accepted, completed, cancelled) is an event on the
#            "ride-events" topic, keyed by ride ID so all events for the
#            same ride stay in order.
# ride-app:  Node.js server. Riders and drivers both connect here over
#            Socket.IO. It publishes ride events to Kafka and consumes
#            them back to broadcast live updates to everyone watching.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ride-zookeeper
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ride-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Advertise the short in-cluster name for container clients, and
      # localhost for anything connecting from your host machine.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"

  ride-app:
    build: ./app
    container_name: ride-app
    depends_on:
      - kafka
    ports:
      - "3001:3000"
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: ride-events
      PORT: 3000

  # Optional web UI to browse the Kafka topic directly.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ride-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
